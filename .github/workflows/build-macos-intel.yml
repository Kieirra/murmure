name: build-macos-intel
on:
    workflow_dispatch:
        inputs:
            dry:
                default: false
                description: Prevent signing and upload
                required: false
                type: boolean
    workflow_call:
        inputs:
            dry:
                default: false
                description: Prevent signing and upload
                required: false
                type: boolean
        secrets:
            TAURI_PRIVATE_KEY:
                required: false
            TAURI_KEY_PASSWORD:
                required: false
            MACOS_CODESIGN_P12_B64:
                required: false
            CERT_PASSWORD:
                required: false
            MACOS_CODESIGN_IDENTITY:
                required: false
            APPLE_ID:
                required: false
            APPLE_ID_PASSWORD:
                required: false
            APPLE_TEAM_ID:
                required: false

permissions:
    contents: read

jobs:
    build-macos-intel:
        runs-on: macos-latest
        timeout-minutes: 200
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7

            - name: Ensure cargo from rustup is first on PATH
              shell: bash
              run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
              with:
                  workspaces: './src-tauri -> target'

            - name: Install pnpm
              run: arch -x86_64 npm install -g pnpm@10.19.0 --ignore-scripts

            - name: Install Rosetta (Intel emulation)
              shell: bash
              run: |
                  set -euo pipefail
                  if ! /usr/bin/pgrep oahd >/dev/null 2>&1; then
                    softwareupdate --install-rosetta --agree-to-license
                  fi

            - name: Add Intel Rust target
              run: rustup target add x86_64-apple-darwin

            - name: Cache ONNX Runtime 1.23.2 (Intel)
              id: ort-cache
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/onnxruntime-osx-x86_64-1.23.2
                  key: ort-1.23.2-osx-x86_64-${{ hashFiles('.github/ort/*.patch') }}

            - name: Build ONNX Runtime 1.23.2 (Intel)
              if: steps.ort-cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  version="1.23.2"
                  src="$RUNNER_TEMP/ort-src"
                  build="$RUNNER_TEMP/ort-build"
                  dest="$RUNNER_TEMP/onnxruntime-osx-x86_64-${version}"
                  git clone --depth 1 --branch "v${version}" https://github.com/microsoft/onnxruntime.git "$src"
                  git -C "$src" apply "$GITHUB_WORKSPACE/.github/ort/0001-mlas-avx2-without-avxvnni.patch"
                  cd "$src"
                  python3 tools/ci_build/build.py --build_dir "$build" --config Release --build_shared_lib --parallel \
                    --skip_tests --skip_submodule_sync --compile_no_warning_as_error \
                    --osx_arch x86_64 --apple_deploy_target 13.4 \
                    --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64 onnxruntime_BUILD_UNIT_TESTS=OFF
                  dylib="$build/Release/libonnxruntime.${version}.dylib"
                  if [ ! -f "$dylib" ]; then
                    echo "::error::$dylib not found"
                    ls -al "$build/Release" || true
                    exit 1
                  fi
                  mkdir -p "$dest/lib"
                  cp "$dylib" "$dest/lib/"
                  ln -sf "libonnxruntime.${version}.dylib" "$dest/lib/libonnxruntime.dylib"
                  install_name_tool -id "@rpath/libonnxruntime.${version}.dylib" "$dest/lib/libonnxruntime.${version}.dylib"
                  otool -D "$dest/lib/libonnxruntime.${version}.dylib"
                  lipo -info "$dest/lib/libonnxruntime.${version}.dylib"

            - name: Export ONNX Runtime paths (Intel)
              shell: bash
              run: |
                  set -euo pipefail
                  version="1.23.2"
                  dest="$RUNNER_TEMP/onnxruntime-osx-x86_64-${version}"
                  echo "ORT_LIB_LOCATION=$dest/lib" >> "$GITHUB_ENV"
                  echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
                  echo "ORT_DYLIB_PATH=$dest/lib/libonnxruntime.${version}.dylib" >> "$GITHUB_ENV"

            - name: Check ONNX Runtime has no AVX-VNNI in AVX2 kernels
              shell: bash
              run: |
                  set -euo pipefail
                  count_vnni_in_avx2_symbols() {
                    otool -tvV "$1" | c++filt | awk '
                      /:$/ && !/^[0-9a-fA-F]+[ \t]/ { avx2 = ($0 ~ /[aA]vx2/) && (tolower($0) !~ /vnni/); symbols += avx2; next }
                      avx2 && /vpdp(wssd|busd)/ { hits++ }
                      END { printf "%d %d\n", symbols, hits }'
                  }

                  version="1.23.2"
                  reference_dir="$(mktemp -d)"
                  curl --proto '=https' -L -o "$reference_dir/ort.tgz" \
                    "https://github.com/microsoft/onnxruntime/releases/download/v${version}/onnxruntime-osx-x86_64-${version}.tgz"
                  echo "d10359e16347b57d9959f7e80a225a5b4a66ed7d7e007274a15cae86836485a6  $reference_dir/ort.tgz" | shasum -a 256 -c -
                  tar xzf "$reference_dir/ort.tgz" -C "$reference_dir"

                  reference="$(count_vnni_in_avx2_symbols "$reference_dir/onnxruntime-osx-x86_64-${version}/lib/libonnxruntime.${version}.dylib")"
                  read -r reference_symbols reference_hits <<<"$reference"
                  echo "Microsoft build: $reference_symbols avx2 symbols inspected, $reference_hits AVX-VNNI instructions"
                  if [ "$reference_symbols" -eq 0 ] || [ "$reference_hits" -eq 0 ]; then
                    echo "::error::Check is miscalibrated: no AVX-VNNI instruction found in the AVX2 kernels of the Microsoft build"
                    exit 1
                  fi

                  result="$(count_vnni_in_avx2_symbols "$ORT_DYLIB_PATH")"
                  read -r symbols hits <<<"$result"
                  echo "Our build: $symbols avx2 symbols inspected, $hits AVX-VNNI instructions"
                  if [ "$symbols" -eq 0 ]; then
                    echo "::error::No avx2 symbol found in $ORT_DYLIB_PATH, the check would verify nothing"
                    exit 1
                  fi
                  if [ "$hits" -gt 0 ]; then
                    echo "::error::$hits AVX-VNNI instructions found in the AVX2 kernels of $ORT_DYLIB_PATH"
                    exit 1
                  fi
                  echo "::notice::No AVX-VNNI instruction in the $symbols avx2 symbols of $ORT_DYLIB_PATH"

            - name: Download & extract ONNX model (macOS)
              shell: bash
              run: |
                  set -euo pipefail
                  url="https://github.com/Kieirra/murmure-model/releases/download/1.3.0/parakeet-tdt-0.6b-v3-int8.zip"
                  tmp="$(mktemp -t model_zip_XXXXXX).zip"
                  echo "Downloading $url"
                  curl --proto '=https' -L -o "$tmp" "$url"
                  echo "Unzipping into ./resources"
                  unzip -o "$tmp" -d resources
                  ls -al resources

            # ── Official Apple code signing ──────────────────────────────
            - name: Import Apple Developer ID certificate
              if: ${{ inputs.dry == false }}
              shell: bash
              env:
                  MACOS_CODESIGN_P12_B64: ${{ secrets.MACOS_CODESIGN_P12_B64 }}
                  MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.CERT_PASSWORD }}
                  MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
              run: |
                  set -euo pipefail

                  # Create a temporary keychain
                  KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

                  # Import certificate
                  printf '%s' "$MACOS_CODESIGN_P12_B64" | base64 -D -o "$RUNNER_TEMP/codesign.p12"
                  security import "$RUNNER_TEMP/codesign.p12" \
                    -k "$KEYCHAIN_PATH" \
                    -P "$MACOS_CODESIGN_P12_PASSWORD" \
                    -A -t cert -f pkcs12
                  rm -f "$RUNNER_TEMP/codesign.p12"

                  # Allow codesign to access the keychain
                  security set-key-partition-list \
                    -S apple-tool:,apple: \
                    -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

                  # Add to search list
                  security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

                  echo "CODESIGN_IDENTITY=${MACOS_CODESIGN_IDENTITY}" >> "$GITHUB_ENV"
                  echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
                  echo "APPLE_SIGNING_IDENTITY=${MACOS_CODESIGN_IDENTITY}" >> "$GITHUB_ENV"

            - name: Install frontend deps
              run: arch -x86_64 pnpm install --ignore-scripts

            - name: Build SmartMic frontend
              run: arch -x86_64 pnpm build:smartmic

            # ── Build ────────────────────────────────────────────────────
            # APPLE_SIGNING_IDENTITY is set so Tauri signs the .app with
            # hardened runtime during the build (required for notarization)
            - name: Build Intel DMG
              run: |
                  arch -x86_64 pnpm tauri build --target x86_64-apple-darwin --bundles dmg,app \
                    --config "{\"bundle\":{\"macOS\":{\"frameworks\":[\"${ORT_DYLIB_PATH}\"]}}}"

            - name: Smoke test transcription (Rosetta)
              shell: bash
              run: |
                  set -uo pipefail
                  arch -x86_64 sysctl -n machdep.cpu.brand_string machdep.cpu.features machdep.cpu.leaf7_features || true

                  say -o "$RUNNER_TEMP/smoke.aiff" "This is a short test of the Murmure transcription engine."
                  afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/smoke.aiff" "$RUNNER_TEMP/smoke.wav"

                  app=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -n 1)
                  if [ -z "$app" ]; then
                    echo "::error::No .app bundle found in src-tauri/target/x86_64-apple-darwin/release/bundle/macos"
                    exit 1
                  fi
                  bin="$app/Contents/MacOS/murmure"
                  file "$bin"
                  file "$app/Contents/Frameworks/libonnxruntime.1.23.2.dylib"

                  if command -v timeout >/dev/null 2>&1; then
                    timeout 600 arch -x86_64 "$bin" transcribe "$RUNNER_TEMP/smoke.wav" --no-dictionary -v \
                      >"$RUNNER_TEMP/smoke.out" 2>"$RUNNER_TEMP/smoke.err"
                  else
                    arch -x86_64 "$bin" transcribe "$RUNNER_TEMP/smoke.wav" --no-dictionary -v \
                      >"$RUNNER_TEMP/smoke.out" 2>"$RUNNER_TEMP/smoke.err"
                  fi
                  rc=$?

                  echo "Exit code: $rc"
                  echo "--- stderr (last 40 lines) ---"
                  tail -n 40 "$RUNNER_TEMP/smoke.err"
                  echo "--- stdout ---"
                  cat "$RUNNER_TEMP/smoke.out"

                  if [ "$rc" -ne 0 ]; then
                    if [ "$rc" -eq 132 ]; then
                      echo "::error::Transcription crashed with SIGILL (exit code 132)"
                    else
                      echo "::error::Transcription failed with exit code $rc"
                    fi
                    exit 1
                  fi
                  text=$(tr -d '[:space:]' <"$RUNNER_TEMP/smoke.out")
                  if [ -z "$text" ]; then
                    echo "::error::Transcription output is empty"
                    exit 1
                  fi
                  echo "::notice::Transcription OK: $(cat "$RUNNER_TEMP/smoke.out")"

            - name: Sign DMG
              if: ${{ inputs.dry == false }}
              shell: bash
              run: |
                  set -euo pipefail
                  identity="${CODESIGN_IDENTITY}"
                  bundle_dir="src-tauri/target/x86_64-apple-darwin/release/bundle"

                  # Sign the DMG
                  dmg_path=$(find "$bundle_dir" -type f -name "*.dmg" | head -n 1)
                  if [ -z "$dmg_path" ]; then
                    echo "::error::No DMG found in $bundle_dir"
                    exit 1
                  fi
                  echo "Signing DMG: $dmg_path"
                  codesign --force --options runtime \
                    --sign "$identity" \
                    --timestamp \
                    "$dmg_path"
                  codesign --verify --strict "$dmg_path"

            # ── Notarization ─────────────────────────────────────────────
            - name: Notarize DMG with Apple
              if: ${{ inputs.dry == false }}
              shell: bash
              env:
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  set -euo pipefail
                  bundle_dir="src-tauri/target/x86_64-apple-darwin/release/bundle"
                  dmg_path=$(find "$bundle_dir" -type f -name "*.dmg" | head -n 1)

                  if [ -z "$dmg_path" ]; then
                    echo "No DMG found to notarize."
                    exit 1
                  fi

                  echo "Submitting DMG for notarization: $dmg_path"
                  xcrun notarytool submit "$dmg_path" \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_ID_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" \
                    --wait

                  echo "Stapling notarization ticket to DMG..."
                  xcrun stapler staple "$dmg_path"

                  echo "Verifying staple..."
                  xcrun stapler validate "$dmg_path"

            # ── Create .app.tar.gz for auto-updater ─────────────────────
            - name: Create .app.tar.gz for updater
              if: ${{ inputs.dry == false }}
              shell: bash
              run: |
                  set -euo pipefail
                  bundle_dir="src-tauri/target/x86_64-apple-darwin/release/bundle/macos"
                  app_path=$(find "$bundle_dir" -maxdepth 1 -name "*.app" -type d | head -n 1)
                  if [ -z "$app_path" ]; then
                    echo "::error::No .app bundle found in $bundle_dir"
                    exit 1
                  fi
                  app_name=$(basename "$app_path")
                  echo "Creating tar.gz from $app_path"
                  tar -czf "$bundle_dir/$app_name.tar.gz" -C "$bundle_dir" "$app_name"

            # ── Tauri update signature ───────────────────────────────────
            - name: Restore Tauri signing key
              if: ${{ inputs.dry == false }}
              shell: bash
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  if [ -n "$TAURI_PRIVATE_KEY" ]; then
                    echo "$TAURI_PRIVATE_KEY" | (base64 --decode 2>/dev/null || base64 -D) > tauri.key
                  else
                    echo "No TAURI_PRIVATE_KEY provided; skipping key restoration."
                  fi

            - name: Sign .app.tar.gz with Tauri signer
              if: ${{ inputs.dry == false }}
              env:
                  TAURI_PRIVATE_KEY_PATH: tauri.key
                  TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              shell: bash
              run: |
                  set -euo pipefail
                  bundle_dir="src-tauri/target/x86_64-apple-darwin/release/bundle"
                  files=$(find "$bundle_dir" -type f -name "*.app.tar.gz")
                  if [ -n "$files" ]; then
                    pnpm tauri signer sign $files
                  else
                    echo "No .app.tar.gz found to sign."
                  fi

            - name: Rename DMG files to Intel suffix
              if: ${{ inputs.dry == false }}
              shell: bash
              run: |
                  set -euo pipefail
                  bundle_dir="src-tauri/target/x86_64-apple-darwin/release/bundle"
                  find "$bundle_dir" -name "*.dmg" -exec sh -c 'mv "$1" "$(dirname "$1")/Murmure_x86_64_darwin.dmg"' _ {} \;

            - name: Rename .app.tar.gz files to Intel suffix
              if: ${{ inputs.dry == false }}
              shell: bash
              run: |
                  set -euo pipefail
                  bundle_dir="src-tauri/target/x86_64-apple-darwin/release/bundle"
                  find "$bundle_dir" -name "*.app.tar.gz" ! -name "*.sig" -exec sh -c 'mv "$1" "$(dirname "$1")/Murmure_x86_64_darwin.app.tar.gz"' _ {} \;
                  find "$bundle_dir" -name "*.app.tar.gz.sig" -exec sh -c 'mv "$1" "$(dirname "$1")/Murmure_x86_64_darwin.app.tar.gz.sig"' _ {} \;

            # ── Cleanup ──────────────────────────────────────────────────
            - name: Cleanup keychain
              if: always()
              shell: bash
              run: |
                  rm -f tauri.key || true
                  if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
                    security delete-keychain "$KEYCHAIN_PATH" || true
                  fi

            - name: Upload artifact (1 day)
              if: ${{ inputs.dry == false }}
              uses: actions/upload-artifact@v4
              with:
                  name: murmure-macos-intel
                  path: |
                      src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
                      src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.app.tar.gz
                      src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.sig
                  retention-days: 1
